<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Kelas XII TKJ 1 - SUPER KEREN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        :root { --primary: #0066ff; --secondary: #00bfff; }
        body { background: #020617; color: #e2e8f0; overflow-x: hidden; transition: 0.3s; }
        body.light { background: #f1f5f9; color: #0f172a; }
        body.light .profil, body.light .info-box, body.light .card { background: white; color: #0f172a; }
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        header { background: linear-gradient(135deg, #0066ff, #00bfff); color: white; text-align: center; padding: 80px 20px 60px 20px; position: relative; overflow: hidden; }
        header h1 { font-size: 46px; font-weight: 900; min-height: 60px; }
        header p { font-size: 20px; font-weight: 700; margin-top: 10px; }
        #countdown { background: rgba(0,0,0,0.25); display: inline-block; padding: 10px 20px; border-radius: 30px; margin-top: 20px; font-weight: 800; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .top-controls { position: fixed; top: 15px; right: 15px; z-index: 999; display: flex; gap: 10px; }
        .control-btn { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        nav { background: rgba(2,6,23,0.8); backdrop-filter: blur(15px); padding: 18px; text-align: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: 800; transition: 0.2s; }
        nav a:hover { color: var(--secondary); text-shadow: 0 0 10px var(--secondary); }
        section { padding: 60px 8%; position: relative; }
        h2 { text-align: center; color: white; margin-bottom: 10px; font-weight: 900; font-size: 34px; text-transform: uppercase; }
        .sub-title { text-align: center; color: #94a3b8; font-weight: 700; margin-bottom: 30px; }
        body.light h2 { color: #0f172a; }
        #searchAnggota { display: block; margin: 0 auto 35px auto; padding: 14px 20px; width: 100%; max-width: 400px; border-radius: 30px; border: 2px solid rgba(0,191,255,0.3); background: rgba(255,255,255,0.05); color: white; font-weight: 700; outline: none; text-align: center; }
        body.light #searchAnggota { background: white; color: black; border-color: #0066ff; }
        .profil, .info-box { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.3); line-height: 1.8; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); }
        .card { background: rgba(255,255,255,0.95); width: 250px; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.2); transition: 0.4s; opacity: 0; transform: translateY(30px); }
        .card.show { opacity: 1; transform: translateY(0); }
        .card:hover { transform: translateY(-10px) scale(1.03); box-shadow: 0 15px 40px rgba(0,191,255,0.4); }
        .anggota { display: flex; justify-content: center; flex-wrap: wrap; gap: 25px; }
        .foto { width: 100%; aspect-ratio: 1/1; overflow: hidden; }
        .foto img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
        .card:hover .foto img { transform: scale(1.1); }
        .card h3 { color: #0f172a; margin: 15px 0 5px 0; font-weight: 900; }
        .card p { margin: 5px 0; color: #334155; font-weight: 700; font-size: 13px; }
        .card p b { color: #0066ff; font-weight: 900; }
        .sosmed { margin-top: 12px; display: flex; justify-content: center; gap: 8px; }
        .sosmed a { text-decoration: none; background: #f1f5f9; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; color: #0f172a; }
        footer { background: #020617; color: #94a3b8; text-align: center; padding: 25px; font-weight: 700; border-top: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>

        <p>Website Biodata Kelas - Kompak, Kreatif, Berprestasi!</p>

    </header>
